<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Advert Detectives – Warm-up Game | Lesson 8 | Grade 7</title>
<style>
:root{--ink:#1f2a44;--slate:#5f6f94;--orange:#e8654a;--pink:#ff5c8a;--purple:#7a3fa0;--teal:#12b5a6;--sky:#2a7de1;--gold:#ffc93c;--ok:#1fa35c;--no:#e0402f;--paper:#fff7ee}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Trebuchet MS","Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);background:var(--paper);font-size:18px;line-height:1.45;min-height:100vh;
background-image:radial-gradient(circle at 6% 12%,#ffd9e6 0 100px,transparent 101px),radial-gradient(circle at 95% 88%,#d9ecff 0 130px,transparent 131px),radial-gradient(circle at 92% 10%,#fff0b8 0 60px,transparent 61px)}
header{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;background:linear-gradient(90deg,var(--purple),var(--pink));color:#fff}
.brand{font-weight:800;font-size:22px;text-shadow:2px 2px 0 #0003}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{background:#ffffff30;border-radius:999px;padding:5px 14px;font-weight:800}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:10px 20px;background:var(--orange);color:#fff;cursor:pointer;box-shadow:0 4px 0 #a9402b;transition:transform .08s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #a9402b}
button:disabled{background:#b9bfd4;box-shadow:0 4px 0 #8c93ad;cursor:not-allowed}
button.ghost{background:#fff;color:var(--ink);border:2px solid #c9cde0;box-shadow:0 4px 0 #c9cde0}
.small{padding:5px 12px;font-size:15px;background:var(--gold);color:var(--ink);box-shadow:0 3px 0 #c79a12}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 8px 22px #7a3fa022;margin:14px 0}
.card h3{margin:0 0 4px;font-size:25px;color:var(--purple)}
.inst{margin:0 0 12px;font-weight:700;color:#4a557e}
.ar{direction:rtl;font-family:Tahoma,Arial,sans-serif}
/* intro */
.hero{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center}
.hero h1{margin:0;font-size:38px;color:var(--purple);line-height:1.1}
.bubble{background:#fff;border:3px solid var(--pink);border-radius:20px;padding:12px 16px;position:relative;font-weight:700;margin-top:10px}
.bubble::before{content:"";position:absolute;left:-14px;top:24px;border:10px solid transparent;border-right:14px solid var(--pink)}
.float{animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.board{width:100%;height:auto;display:block;border-radius:18px;margin:10px 0}
/* stage */
.sh{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;background:linear-gradient(100deg,var(--c),var(--c2));color:#fff;border-radius:20px;padding:10px 18px}
.sh h2{margin:0;font-size:24px;text-shadow:2px 2px 0 #0003}
.dots{display:flex;gap:6px}.dots i{width:14px;height:14px;border-radius:50%;background:#ffffff66}.dots i.d{background:#fff}.dots i.a{background:var(--gold);transform:scale(1.3)}
.nav{display:flex;justify-content:space-between;gap:10px;margin:8px 0 24px}
.pulse{animation:pl 1s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.07)}}
/* drag */
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:12px;background:#f1eaff;border-radius:16px;margin:12px 0;min-height:58px}
.chip{display:inline-block;padding:8px 16px;border-radius:999px;background:#fff;border:3px solid var(--purple);font-weight:800;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;box-shadow:0 3px 0 #c9aee6}
.chip.long{border-radius:16px;text-align:left;max-width:300px;font-size:16px;font-weight:700}
.chip.sel{background:var(--gold);border-color:#d49a00;transform:scale(1.06)}
.chip.lift{opacity:.3}
.chip.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);background:var(--gold);border-color:#d49a00}
.chip.gone{display:none}
.chip.placed{cursor:default;background:#e3f7ec;border-color:var(--ok);box-shadow:none}
.chip.letter{font-size:30px;width:56px;height:56px;padding:0;display:grid;place-items:center;border-radius:14px}
.tgt.hov{background:#fff3c4!important;border-color:var(--gold)!important;transform:scale(1.03)}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.basket{border:4px dashed #aab6e6;border-radius:20px;padding:10px;min-height:170px;text-align:center}
.basket h4{margin:0 0 6px;font-size:22px}
.basket.y{background:#e9f9ef;border-color:#5cc480}.basket.n{background:#ffeceb;border-color:#f08a80}
.drop{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.slots{display:flex;gap:10px;justify-content:center;margin:10px 0}
.slot{width:60px;height:68px;border:4px dashed var(--purple);border-radius:14px;display:grid;place-items:center;font-size:34px;font-weight:900;color:var(--ok);background:#faf5ff}
.slot.filled{border-style:solid;border-color:var(--ok);background:#e3f7ec}
.def{display:none;background:linear-gradient(120deg,#fff3b0,#ffe0ef);border:4px solid var(--pink);border-radius:20px;padding:14px 18px;text-align:center;animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
.def.on{display:block}
.def b.big{font-size:40px;color:var(--purple);letter-spacing:2px}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.mock{border:4px solid var(--purple);border-radius:20px;overflow:hidden;max-width:640px;margin:0 auto;background:#fbf4ff}
.part{display:grid;grid-template-columns:34px 1fr 150px;gap:10px;align-items:center;padding:8px 12px;border-bottom:3px dashed #d9bff0;transition:.15s}
.part:last-child{border:0}
.part .pn{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;font-weight:800;display:grid;place-items:center}
.part .fill{font-weight:800;color:#8b93b8;text-align:center;border:3px dashed #c9cde0;border-radius:12px;padding:6px 4px;min-height:44px;display:grid;place-items:center;font-size:16px}
.part.filled{background:#e9f9ef}
.part.filled .fill{color:var(--ok);border-style:solid;border-color:var(--ok);background:#fff}
.part svg{max-width:100%;height:auto;display:block}
.q{padding:12px 0;border-bottom:2px dotted #d5daf0}.q:last-child{border:0}
.q p{margin:0 0 8px;font-weight:800;font-size:20px}
.opts{display:grid;gap:10px}
.opt{background:#fff;color:var(--ink);border:3px solid var(--sky);box-shadow:0 4px 0 #b8c8f0;text-align:left;font-size:18px}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:none}
.opt.no{background:var(--no);border-color:var(--no);color:#fff;box-shadow:none}
.exp{color:var(--ok);font-weight:800;margin-top:6px}
.shake{animation:sk .4s}
@keyframes sk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.msg{font-weight:800;font-size:20px;min-height:30px;margin-top:6px}
.conf{position:fixed;top:-40px;z-index:99;font-size:28px;pointer-events:none;animation:fall 2.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.up{position:fixed;z-index:98;font-size:38px;pointer-events:none;animation:upk 1.3s ease-out forwards}
@keyframes upk{to{transform:translateY(-120px) scale(1.6);opacity:0}}
.end{text-align:center}
.end h2{font-size:34px;color:var(--purple);margin:6px 0}
.badge{max-width:420px;margin:10px auto;border:8px double var(--gold);border-radius:24px;padding:14px;background:#fff}
.badge input{font:inherit;padding:8px 14px;border:3px solid var(--sky);border-radius:12px;text-align:center;width:90%}
footer{text-align:center;padding:16px;font-weight:800;color:var(--purple)}
@media (max-width:700px){.hero{grid-template-columns:1fr;text-align:center}.hero .m{max-width:150px;margin:auto}.bubble::before{display:none}.part{grid-template-columns:30px 1fr}.part .fill{grid-column:1/-1}.baskets{grid-template-columns:1fr}.hero h1{font-size:30px}}
@media (prefers-reduced-motion:reduce){.float,.pulse{animation:none}}
</style>
</head>
<body>
<header><div class="brand">📢 Advert Detectives</div><div class="hud"><span class="pill" id="score">⭐ 0</span><button class="small" id="mute">🔊 Sound</button></div></header>
<main id="view"></main>
<footer>Created by T. Badria Alfalahi</footer>

<script>
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const view=$('#view');

/* ---------- sound / speech ---------- */
let muted=false,AC;
function tone(f,d,type='sine',when=0,vol=.08){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+when;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d);}catch(e){}}
const good=()=>{tone(660,.12);tone(880,.12,'sine',.1);tone(1175,.2,'sine',.2)};
const bad=()=>{tone(200,.2,'sawtooth');tone(150,.28,'sawtooth',.15)};
const win=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,'triangle',i*.12,.1));
$('#mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇 Muted':'🔊 Sound';};
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u);}catch(e){}}

/* ---------- state ---------- */
const S={score:0,got:new Set(),bad:new Set(),sel:null};
function attempt(key,ok){
  if(ok){good();if(!S.bad.has(key)&&!S.got.has(key)){S.got.add(key);S.score+=10;$('#score').textContent='⭐ '+S.score;}}
  else{bad();S.bad.add(key);}
}
function shake(e){e.classList.add('shake');setTimeout(()=>e.classList.remove('shake'),420);}
function confetti(n=24){const em=['🎉','⭐','📢','✨','🎊','🔍','🌟'];for(let i=0;i<n;i++){const c=el('div','conf',em[i%em.length]);c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3800);}}
function floatUp(em,from){const r=from.getBoundingClientRect(),d=el('div','up',em);d.style.left=(r.left+r.width/2)+'px';d.style.top=r.top+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1400);}

/* ---------- drag & drop engine (mouse + touch + tap-to-place) ---------- */
function dnd(chips,targets,handler){
  chips.forEach(ch=>{
    ch.addEventListener('pointerdown',e=>{
      if(ch.classList.contains('gone')||ch.classList.contains('placed'))return;
      e.preventDefault();
      const sx=e.clientX,sy=e.clientY;let ghost=null,moved=false;
      const mv=ev=>{
        if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>8){moved=true;ghost=ch.cloneNode(true);ghost.className='chip ghost';document.body.appendChild(ghost);ch.classList.add('lift');if(S.sel){S.sel.classList.remove('sel');S.sel=null;}}
        if(moved){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';const t=document.elementFromPoint(ev.clientX,ev.clientY),tg=t&&t.closest('.tgt');targets.forEach(x=>x.classList.toggle('hov',x===tg));}
      };
      const up=ev=>{
        window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
        targets.forEach(x=>x.classList.remove('hov'));
        if(moved){ghost.remove();ch.classList.remove('lift');const t=document.elementFromPoint(ev.clientX,ev.clientY),tg=t&&t.closest('.tgt');if(tg&&targets.includes(tg))handler(ch,tg);}
        else{if(S.sel===ch){ch.classList.remove('sel');S.sel=null;}else{if(S.sel)S.sel.classList.remove('sel');S.sel=ch;ch.classList.add('sel');}}
      };
      window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
    });
  });
  targets.forEach(t=>t.addEventListener('click',()=>{if(S.sel&&chips.includes(S.sel)){const c=S.sel;c.classList.remove('sel');S.sel=null;handler(c,t);}}));
}
const chipEl=(v,cls='')=>{const c=el('span','chip '+cls,v);c.dataset.v=v;return c;};

/* ---------- artwork ---------- */
const GIRL=`<svg viewBox="0 0 90 110" aria-hidden="true"><path d="M14 110V78Q14 58 45 58Q76 58 76 78V110Z" fill="#8e44ad"/><path d="M45 6C22 6 14 26 17 46C20 64 33 68 45 68C57 68 70 64 73 46C76 26 68 6 45 6Z" fill="#ff5c8a"/><ellipse cx="45" cy="40" rx="17" ry="19" fill="#ffcf9f"/><circle cx="38" cy="39" r="2.6" fill="#1f2a44"/><circle cx="52" cy="39" r="2.6" fill="#1f2a44"/><path d="M37 48Q45 56 53 48" stroke="#1f2a44" stroke-width="2.8" fill="none" stroke-linecap="round"/><circle cx="32" cy="46" r="3.2" fill="#ff8aa0" opacity=".7"/><circle cx="58" cy="46" r="3.2" fill="#ff8aa0" opacity=".7"/><path d="M28 24Q45 12 62 24" stroke="#e8365d" stroke-width="3" fill="none"/><circle cx="76" cy="78" r="11" fill="#ffffff99" stroke="#1f2a44" stroke-width="4"/><path d="M68 86L58 98" stroke="#1f2a44" stroke-width="6" stroke-linecap="round"/><path d="M30 100l6 -14 M60 100l-6 -14" stroke="none"/></svg>`;
const BOARD=`<svg class="board" viewBox="0 0 600 190" role="img" aria-label="A big advert billboard by the road"><defs><linearGradient id="bk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fdcff"/><stop offset="1" stop-color="#eaf9ff"/></linearGradient></defs><rect width="600" height="190" fill="url(#bk)"/><circle cx="540" cy="34" r="20" fill="#ffd23f"/><g fill="#fff"><ellipse cx="100" cy="34" rx="30" ry="10"/><ellipse cx="124" cy="28" rx="20" ry="10"/><ellipse cx="400" cy="26" rx="26" ry="9"/></g><rect y="160" width="600" height="30" fill="#6cc551"/><rect y="168" width="600" height="14" fill="#555"/><path d="M0 175H600" stroke="#fff" stroke-width="3" stroke-dasharray="22 16"/><rect x="205" y="100" width="12" height="62" fill="#8d5a2b"/><rect x="383" y="100" width="12" height="62" fill="#8d5a2b"/><rect x="150" y="14" width="300" height="100" rx="8" fill="#fff" stroke="#5b2a86" stroke-width="6"/><rect x="150" y="14" width="300" height="26" fill="#7a3fa0"/><text x="300" y="34" text-anchor="middle" font-size="18" font-weight="900" fill="#fff" font-family="Trebuchet MS,Arial">COME TO WATER PARK!</text><circle cx="205" cy="76" r="22" fill="#29b6f6"/><path d="M190 80Q198 70 206 80T222 80" stroke="#fff" stroke-width="3" fill="none"/><path d="M240 60H430M240 74H400M240 88H415" stroke="#cfd3e6" stroke-width="6" stroke-linecap="round"/><g transform="rotate(-8 410 94)"><rect x="352" y="80" width="88" height="26" rx="13" fill="#ffd23f" stroke="#e8654a" stroke-width="3"/><text x="396" y="98" text-anchor="middle" font-size="12" font-weight="900" fill="#d62839" font-family="Trebuchet MS,Arial">2 FOR 1!</text></g><g fill="#e8654a"><rect x="60" y="130" width="40" height="30" rx="4" fill="#ffd23f"/><circle cx="530" cy="140" r="14" fill="#ff5c8a"/></g></svg>`;
const parkPic=`<svg viewBox="0 0 220 90"><rect width="220" height="90" fill="#bfeaff"/><circle cx="190" cy="20" r="12" fill="#ffd23f"/><rect y="62" width="220" height="28" fill="#29b6f6"/><path d="M0 72Q14 66 28 72T56 72T84 72T112 72T140 72T168 72T196 72T224 72" stroke="#fff" stroke-width="2.5" fill="none"/><rect x="40" y="18" width="9" height="50" fill="#8d5a2b"/><path d="M49 22C100 14 110 52 140 66" stroke="#ff5c5c" stroke-width="11" fill="none" stroke-linecap="round"/><path d="M49 22C100 14 110 52 140 66" stroke="#ffd23f" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="165" cy="66" r="12" fill="none" stroke="#ff5c5c" stroke-width="6"/><circle cx="165" cy="66" r="12" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="9 9"/></svg>`;
const burst=(()=>{let p=[];for(let i=0;i<16;i++){const r=i%2?19:28,a=(i*22.5-90)*Math.PI/180;p.push((32+r*Math.cos(a)).toFixed(1)+','+(32+r*Math.sin(a)).toFixed(1));}return `<svg viewBox="0 0 64 64" style="width:78px"><polygon points="${p.join(' ')}" fill="#ffd23f" stroke="#e8654a" stroke-width="2"/><text x="32" y="30" text-anchor="middle" font-size="8" font-weight="900" fill="#d62839" font-family="Trebuchet MS,Arial">SPECIAL</text><text x="32" y="42" text-anchor="middle" font-size="9" font-weight="900" fill="#d62839" font-family="Trebuchet MS,Arial">OFFER!</text></svg>`;})();
const adventureScene=`<svg viewBox="0 0 560 190" class="board" role="img" aria-label="A picture of an adventure playground"><defs><linearGradient id="av" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fdcff"/><stop offset="1" stop-color="#eaf9ff"/></linearGradient></defs><rect width="560" height="190" fill="url(#av)"/><circle cx="510" cy="34" r="20" fill="#ffd23f"/><g fill="#fff"><ellipse cx="90" cy="34" rx="30" ry="10"/><ellipse cx="300" cy="24" rx="26" ry="9"/></g><path d="M0 190V120Q90 80 200 115T380 110T560 120V190Z" fill="#6cc551"/><path d="M0 190V150Q150 132 300 150T560 148V190Z" fill="#4caf50"/><g><rect x="28" y="96" width="8" height="40" fill="#8d5a2b"/><circle cx="32" cy="84" r="24" fill="#2e8b57"/><rect x="520" y="104" width="8" height="40" fill="#8d5a2b"/><circle cx="524" cy="92" r="22" fill="#2e8b57"/></g><path d="M70 20V150M300 78V152" stroke="#8d5a2b" stroke-width="8" stroke-linecap="round"/><path d="M70 28L300 82" stroke="#1f2a44" stroke-width="3"/><g transform="translate(180 54) scale(1.5)"><path d="M0 0V7" stroke="#1f2a44" stroke-width="2"/><circle cy="12" r="5" fill="#ffcf9f"/><path d="M-5 11Q-5 5 0 5Q5 5 5 11Z" fill="#ff7a1a"/><path d="M0 17V29M0 20L-7 26M0 20L7 26M0 29L-5 39M0 29L5 39" stroke="#e8365d" stroke-width="3" stroke-linecap="round" fill="none"/></g><rect x="350" y="34" width="86" height="112" rx="4" fill="#d2a679" stroke="#6d4c41" stroke-width="4"/><circle cx="370" cy="124" r="6" fill="#e53935"/><circle cx="404" cy="108" r="6" fill="#1e88e5"/><circle cx="424" cy="128" r="6" fill="#43a047"/><circle cx="374" cy="82" r="6" fill="#fdd835"/><circle cx="420" cy="76" r="6" fill="#8e24aa"/><circle cx="398" cy="52" r="6" fill="#fb8c00"/><ellipse cx="470" cy="144" rx="34" ry="8" fill="#29b6f6" stroke="#1f2a44" stroke-width="3"/><path d="M440 148L436 162M500 148L504 162" stroke="#1f2a44" stroke-width="3"/><circle cx="470" cy="104" r="7" fill="#ffcf9f"/><path d="M470 112V130M470 118L458 106M470 118L482 106M470 130L462 142M470 130L478 142" stroke="#8e44ad" stroke-width="4" stroke-linecap="round" fill="none"/></svg>`;

/* ---------- tasks ---------- */
const tasks=[
{title:'Spot the Adverts! 🔎',inst:'Drag each card into the correct basket. Is it an advert or not? هل هو إعلان أم لا؟',n:8,render(box,ctx){
  const items=[['🏞️ “Come to Sunny Water Park! 2 tickets for the price of 1!”','y'],['📅 “Class timetable: Sunday – English, Maths, Science”','n'],['📺 On TV: “Fresh orange juice! Try it today!”','y'],['📖 “Once upon a time, a little fox lived in a forest…”','n'],['🛍️ “SALE! 50% off all shoes – visit our shop!”','y'],['🛒 “Shopping list: milk, bread, eggs”','n'],['🎬 “New film! Watch it in cinemas from Friday!”','y'],['✉️ “Dear Mona, I hope you are well…”','n']];
  box.innerHTML=`<div class="baskets"><div class="basket y tgt" data-b="y"><h4>📢 ADVERT</h4><div class="drop"></div></div><div class="basket n tgt" data-b="n"><h4>❌ NOT an advert</h4><div class="drop"></div></div></div>`;
  const bank=el('div','bank');const chips=shuffle(items).map(([t,b])=>{const c=chipEl(t,'long');c.dataset.b=b;return c;});chips.forEach(c=>bank.appendChild(c));box.appendChild(bank);
  dnd(chips,[...box.querySelectorAll('.basket')],(ch,t)=>{
    const ok=ch.dataset.b===t.dataset.b;attempt('t1'+ch.dataset.v,ok);
    if(!ok){shake(t);return;}
    $('.drop',t).appendChild(ch);ch.classList.add('placed');floatUp('⭐',ch);ctx.hit();
  });
}},
{title:'Crack the Code! 🔐',inst:'Drag the letters to spell the mystery word. اسحب الحروف لتكوين الكلمة السرية.',n:6,render(box,ctx){
  const w='ADVERT';
  box.innerHTML=`<div class="slots">${[...w].map((l,i)=>`<div class="slot tgt" data-ans="${l}" data-k="${i}"></div>`).join('')}</div>`;
  const bank=el('div','bank');const chips=shuffle([...w]).map(l=>chipEl(l,'letter'));chips.forEach(c=>bank.appendChild(c));box.appendChild(bank);
  const def=el('div','def',`<b class="big">ADVERT</b> <button class="small" id="sw">🔊 Say it</button><p style="margin:6px 0 2px;font-weight:800;font-size:21px">An <b>advert</b> is a message that tells people about a product, a place or an event.</p><p class="ar" style="margin:2px 0;font-size:22px;font-weight:800;color:var(--purple)">Advert = إعلان</p><p style="margin:2px 0;font-weight:700">Short forms: <i>ad</i> · <i>advertisement</i></p>`);
  box.appendChild(def);
  let n=0;
  dnd(chips,[...box.querySelectorAll('.slot')],(ch,t)=>{
    if(t.classList.contains('filled'))return;
    const ok=ch.dataset.v===t.dataset.ans;attempt('t2'+t.dataset.k,ok);
    if(!ok){shake(t);return;}
    t.textContent=ch.dataset.v;t.classList.add('filled');ch.classList.add('gone');ctx.hit();n++;
    if(n===6){setTimeout(()=>{def.classList.add('on');confetti(18);speak('Advert. An advert is a message that tells people about a product, a place or an event.');$('#sw',box).onclick=()=>speak('Advert. Ad. Advertisement.');},300);}
  });
}},
{title:'Inside an Advert 🧩',inst:'What can we find in an advert? Drag each label to the right part. ماذا نجد داخل الإعلان؟',n:4,render(box,ctx){
  const parts=[['A question to start',`<b style="font-size:19px">Do you love water slides? Are you ready for a splash?</b>`],['Pictures',parkPic],['A special offer',burst],['Contact details',`📞 <b>Visit our website or phone 1234 5678</b>`]];
  const m=el('div','mock');
  parts.forEach(([a,h],i)=>{const p=el('div','part tgt',`<span class="pn">${i+1}</span><div class="pc">${h}</div><div class="fill">?</div>`);p.dataset.ans=a;p.dataset.k=i;m.appendChild(p);});
  const bank=el('div','bank');const chips=shuffle(parts.map(p=>p[0])).map(w=>chipEl(w));chips.forEach(c=>bank.appendChild(c));
  box.append(m,bank);
  dnd(chips,[...m.children],(ch,t)=>{
    if(t.classList.contains('filled'))return;
    const ok=ch.dataset.v===t.dataset.ans;attempt('t3'+t.dataset.k,ok);
    if(!ok){shake(t);return;}
    $('.fill',t).textContent=ch.dataset.v;t.classList.add('filled');ch.classList.add('gone');floatUp('⭐',t);ctx.hit();
  });
}},
{title:'Advert Quiz 🎯',inst:'Choose the correct answer.',n:4,render(box,ctx){
  const qs=[
   {q:'Which one is an advert?',o:['A school timetable','A poster for a new cinema film','A page from a diary'],a:1,exp:'A poster that tells us about a film is an advert.'},
   {q:'Why do people make adverts?',o:['To give us homework','To teach us grammar','To make us want to buy or visit something'],a:2,exp:'Adverts make people want to buy, visit or try something.'},
   {q:'Where can we see adverts?',o:['Only in the classroom','On TV, on posters and on websites','Only in story books'],a:1,exp:'Adverts are everywhere – on TV, posters, websites and magazines!'},
   {q:'What can we find in an advert?',o:['A maths test','A long story with chapters','Pictures, a special offer and how to buy'],a:2,exp:'Pictures, offers and contact details are common in adverts.'}
  ];
  qs.forEach((q,qi)=>{
    const d=el('div','q',`<p>${qi+1}. ${q.q}</p>`),o=el('div','opts'),ex=el('div','exp');let done=false;
    shuffle(q.o.map((t,i)=>[t,i])).forEach(([t,i])=>{
      const b=el('button','opt',t);
      b.onclick=()=>{if(done)return;const ok=i===q.a;attempt('t4'+qi,ok);if(ok){done=true;b.classList.add('ok');ex.textContent='✔ '+q.exp;floatUp('⭐',b);ctx.hit();}else{b.classList.add('no');b.disabled=true;shake(b);}};
      o.appendChild(b);
    });
    d.append(o,ex);box.appendChild(d);
  });
}},
{title:'Treetops Teaser 🌳',inst:'Look at the pictures in this advert. What do you think it is about? انظري إلى الصور وتوقّعي.',n:2,render(box,ctx){
  box.innerHTML=adventureScene;
  const qs=[
   {q:'What do you think this advert is about?',o:['A shopping centre','An adventure playground','A school lesson'],a:1,exp:'Yes! Zip wire, climbing wall and trampoline – it is an adventure playground!'},
   {q:'Who is the advert for?',o:['Children and families','Only teachers','Only babies'],a:0,exp:'It is for children and the whole family.'}
  ];
  qs.forEach((q,qi)=>{
    const d=el('div','q',`<p>${qi+1}. ${q.q}</p>`),o=el('div','opts'),ex=el('div','exp');let done=false;
    q.o.forEach((t,i)=>{const b=el('button','opt',t);b.onclick=()=>{if(done)return;const ok=i===q.a;attempt('t5'+qi,ok);if(ok){done=true;b.classList.add('ok');ex.textContent='✔ '+q.exp;floatUp('⭐',b);ctx.hit();}else{b.classList.add('no');b.disabled=true;shake(b);}};o.appendChild(b);});
    d.append(o,ex);box.appendChild(d);

  box.appendChild(el('div','bubble','💬 <b>Think and say:</b> Would you like to go to this place? Why? / Why not?'));

];
const MAX=tasks.reduce((a,t)=>a+t.n*10,0);

/* ---------- screens ---------- */
function intro(){
  S.sel=null;
  view.innerHTML=`<div class="card"><div class="hero"><div class="m float">${GIRL}</div><div><h1>Advert Detectives!</h1><p style="margin:6px 0 0;font-weight:700">Today we start a new lesson. Can you discover the secret word? 🔍</p><div class="bubble">Hi, I’m Detective Salma! 🕵️‍♀️ Help me find out what an <b>advert</b> is. Drag the cards, spell the word and win your badge!</div></div></div>${BOARD}<div class="row" style="text-align:center"><button id="go">🚀 Start the mission</button></div><p class="ar" style="text-align:center;font-weight:700;margin:8px 0 0">المهمة: تعرّفي على كلمة <b>advert</b> (إعلان) — اسحبي البطاقات وأجيبي عن الأسئلة.</p></div>`;
  $('#go').onclick=()=>{win();run();};
}
function run(){
  let i=0;view.innerHTML='';const wrap=el('div');view.appendChild(wrap);
  const cols=[['#7a3fa0','#ff5c8a'],['#2a7de1','#6ec6ff'],['#12b5a6','#5cc450'],['#e8654a','#ffb347'],['#8e44ad','#2a7de1']];
  function show(){
    const t=tasks[i];S.sel=null;
    wrap.innerHTML=`<div class="sh" style="--c:${cols[i][0]};--c2:${cols[i][1]}"><h2>Mission ${i+1} / ${tasks.length}</h2><div class="dots">${tasks.map((_,k)=>`<i class="${k<i?'d':k===i?'a':''}"></i>`).join('')}</div></div><div class="card"><h3>${t.title}</h3><p class="inst">${t.inst}</p><div id="tb"></div></div><div class="nav"><button class="ghost" id="hm">⌂ Start</button><button id="nx" disabled>${i<tasks.length-1?'Next ▶':'Finish 🏆'}</button></div>`;
    const nx=$('#nx',wrap);let got=0;
    t.render($('#tb',wrap),{hit(){got++;if(got>=t.n){nx.disabled=false;nx.classList.add('pulse');win();}}});
    $('#hm',wrap).onclick=intro;
    nx.onclick=()=>{if(i<tasks.length-1){i++;show();window.scrollTo(0,0);}else end();};
  }
  show();window.scrollTo(0,0);
}
function end(){
  confetti(40);win();
  const pct=S.score/MAX,st=pct>=.9?5:pct>=.75?4:pct>=.55?3:2;
  view.innerHTML=`<div class="card end"><div class="float" style="width:140px;margin:auto">${GIRL}</div><h2>Super Detective! 🎉</h2><p style="font-weight:800;font-size:22px;margin:0">You discovered the word <span style="color:var(--pink)">ADVERT</span> (إعلان)!</p><div class="badge"><div style="font-size:44px">📢🏅</div><div style="font-weight:800;color:var(--purple);font-size:22px">Advert Detective</div><div style="font-size:34px">${'⭐'.repeat(st)}${'☆'.repeat(5-st)}</div><p style="margin:4px 0"><input id="nm" placeholder="Type your name ✏️"></p><div style="font-weight:800">Score: ${S.score} / ${MAX}</div></div><div class="bubble" style="text-align:left;max-width:560px;margin:10px auto">📖 <b>Now we are ready!</b> In today’s lesson you will read an advert for an <b>adventure playground</b> and learn new words: zip wire, trampoline, climbing wall, harness, maze and tunnel.</div><div class="row" style="text-align:center;margin-top:12px"><button id="again">🔁 Play again</button></div></div>`;
  $('#again').onclick=()=>{S.score=0;S.got.clear();S.bad.clear();$('#score').textContent='⭐ 0';intro();};
}
intro();
</script>
</body>
</html>
